<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cantadas de Gato</title>
</head>
<body>

    <!-- Flores decorativas nos 4 cantos -->
    <span class="flor flor-topo-esquerda">🌸</span>
    <span class="flor flor-topo-direita">🌺</span>
    <span class="flor flor-baixo-esquerda">🌼</span>
    <span class="flor flor-baixo-direita">🌷</span>

    <div class="page">

        <div class="grid">
            <img id="img1" class="foto" src="" alt="gatinho">
            <img id="img2" class="foto" src="" alt="gatinho">
        </div>

        <div class="grid grid-meio">
            <img id="img3" class="foto" src="" alt="gatinho">
            <img id="img4" class="foto" src="" alt="gatinho">
        </div>

        <div class="grid">
            <img id="img5" class="foto" src="" alt="gatinho">
            <img id="img6" class="foto" src="" alt="gatinho">
        </div>

        <div class="balao" id="balao">
            <h2 id="cantada">Clique para sortear uma cantada</h2>
        </div>

        <!-- Botão que às vezes aparece, revelando a imagem especial ao clicar -->
        <button id="btnEspecial" class="btn-especial escondida">Clique</button>
        <div id="imgEspecial" class="img-especial escondida">
            <button id="btnFechar" class="btn-especial">X</button>
            <img class="imagem-especial" src="img/eu.png" alt="imagem especial">
            <h1 class="txtEspecial">RAWN</h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
